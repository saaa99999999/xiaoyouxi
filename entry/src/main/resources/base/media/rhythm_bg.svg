<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 780" width="360" height="780">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D0D2B"/>
      <stop offset="100%" stop-color="#1A1A3E"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#007DFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#007DFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#007DFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  <!-- 背景 -->
  <rect width="360" height="780" fill="url(#bg)"/>
  <!-- 音波纹理 -->
  <g opacity="0.12">
    <path d="M0 200 Q90 180 180 200 Q270 220 360 200" fill="none" stroke="#007DFF" stroke-width="2"/>
    <path d="M0 250 Q90 230 180 250 Q270 270 360 250" fill="none" stroke="#007DFF" stroke-width="1.5"/>
    <path d="M0 300 Q90 280 180 300 Q270 320 360 300" fill="none" stroke="#007DFF" stroke-width="1"/>
    <path d="M0 350 Q90 330 180 350 Q270 370 360 350" fill="none" stroke="#007DFF" stroke-width="0.8"/>
    <path d="M0 400 Q90 380 180 400 Q270 420 360 400" fill="none" stroke="#007DFF" stroke-width="0.6"/>
    <path d="M0 450 Q90 430 180 450 Q270 470 360 450" fill="none" stroke="#007DFF" stroke-width="0.5"/>
    <path d="M0 500 Q90 480 180 500 Q270 520 360 500" fill="none" stroke="#007DFF" stroke-width="0.4"/>
    <path d="M0 550 Q90 530 180 550 Q270 570 360 550" fill="none" stroke="#007DFF" stroke-width="0.3"/>
  </g>
  <!-- 轨道分割线 -->
  <line x1="90" y1="100" x2="90" y2="680" stroke="#222255" stroke-width="1" stroke-dasharray="4,8"/>
  <line x1="180" y1="100" x2="180" y2="680" stroke="#222255" stroke-width="1" stroke-dasharray="4,8"/>
  <line x1="270" y1="100" x2="270" y2="680" stroke="#222255" stroke-width="1" stroke-dasharray="4,8"/>
  <!-- 底部发光 -->
  <rect x="0" y="660" width="360" height="3" fill="url(#glow)" filter="url(#blur)"/>
  <!-- 粒子装饰 -->
  <g opacity="0.3">
    <circle cx="45" cy="150" r="1.5" fill="#007DFF"/>
    <circle cx="135" cy="200" r="1" fill="#FF6B35"/>
    <circle cx="225" cy="170" r="1.5" fill="#00C853"/>
    <circle cx="315" cy="190" r="1" fill="#007DFF"/>
    <circle cx="60" cy="580" r="1" fill="#FFD600"/>
    <circle cx="300" cy="620" r="1.5" fill="#007DFF"/>
    <circle cx="180" cy="100" r="1" fill="#FF6B35"/>
  </g>
</svg>
