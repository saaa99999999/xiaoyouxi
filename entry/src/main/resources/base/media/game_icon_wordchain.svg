<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5D4037"/>
      <stop offset="100%" stop-color="#795548"/>
    </linearGradient>
  </defs>
  <circle cx="48" cy="48" r="44" fill="#FFF8E1" opacity="0.4"/>
  <!-- 书卷背景 -->
  <rect x="12" y="16" width="72" height="64" rx="6" fill="#FFF3E0" stroke="#D7CCC8" stroke-width="1"/>
  <rect x="16" y="20" width="64" height="56" rx="4" fill="#FFFFFF" opacity="0.5"/>
  <!-- 字链 -->
  <text x="22" y="38" font-size="14" font-family="sans-serif" fill="url(#ink)" font-weight="bold">天</text>
  <path d="M34 34 L40 34" stroke="#5D4037" stroke-width="1.5" marker-end="none" opacity="0.4"/>
  <text x="42" y="38" font-size="14" font-family="sans-serif" fill="#FF6B35" font-weight="bold">空</text>
  <path d="M54 34 L60 34" stroke="#FF6B35" stroke-width="1.5" opacity="0.4"/>
  <text x="62" y="38" font-size="14" font-family="sans-serif" fill="#007DFF" font-weight="bold">气</text>
  <!-- 第二行 -->
  <text x="22" y="58" font-size="14" font-family="sans-serif" fill="#7C4DFF" font-weight="bold">球</text>
  <path d="M34 54 L40 54" stroke="#7C4DFF" stroke-width="1.5" opacity="0.4"/>
  <text x="42" y="58" font-size="14" font-family="sans-serif" fill="#00C853" font-weight="bold">场</text>
  <!-- 下划线强调 -->
  <rect x="20" y="62" width="60" height="1" fill="#D7CCC8" opacity="0.3"/>
  <!-- 墨滴装饰 -->
  <circle cx="48" cy="78" r="2.5" fill="#5D4037" opacity="0.15"/>
  <circle cx="52" cy="80" r="1.5" fill="#5D4037" opacity="0.1"/>
</svg>
