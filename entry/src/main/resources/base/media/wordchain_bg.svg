<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 780" width="360" height="780">
  <defs>
    <linearGradient id="parchment" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF8E1"/>
      <stop offset="100%" stop-color="#FFF3E0"/>
    </linearGradient>
    <pattern id="texture" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="none"/>
      <circle cx="3" cy="3" r="0.3" fill="#D7CCC8" opacity="0.3"/>
    </pattern>
  </defs>
  <!-- 书卷底色 -->
  <rect width="360" height="780" fill="url(#parchment)"/>
  <rect width="360" height="780" fill="url(#texture)"/>
  <!-- 古典边框 -->
  <rect x="12" y="12" width="336" height="756" rx="4" fill="none" stroke="#D7CCC8" stroke-width="1.5"/>
  <rect x="16" y="16" width="328" height="748" rx="3" fill="none" stroke="#BCAAA4" stroke-width="0.5" stroke-dasharray="8,4"/>
  <!-- 角落装饰 -->
  <g stroke="#BCAAA4" stroke-width="1.5" fill="none" opacity="0.4">
    <path d="M24 40 L24 24 L40 24"/>
    <path d="M336 24 L320 24 L320 24" transform="translate(16,0)"/>
    <path d="M24 740 L24 756 L40 756"/>
    <path d="M320 756 L336 756 L336 740"/>
  </g>
  <!-- 顶部标题区域 -->
  <rect x="20" y="20" width="320" height="60" rx="6" fill="#FFFFFF" opacity="0.5" stroke="#D7CCC8" stroke-width="0.5"/>
  <text x="180" y="55" text-anchor="middle" font-size="16" font-family="serif" fill="#8D6E63" opacity="0.6">词语接龙</text>
  <!-- 底部墨迹装饰 -->
  <g opacity="0.05">
    <ellipse cx="100" cy="700" rx="40" ry="8" fill="#5D4037"/>
    <ellipse cx="260" cy="720" rx="30" ry="6" fill="#5D4037"/>
  </g>
</svg>
