<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#007DFF"/>
      <stop offset="100%" stop-color="#536DFE"/>
    </linearGradient>
  </defs>
  <!-- 背景圆 -->
  <circle cx="48" cy="48" r="44" fill="#E3F2FD" opacity="0.5"/>
  <!-- 音符主体 -->
  <g transform="translate(48,42)">
    <!-- 音符头 -->
    <ellipse cx="-8" cy="12" rx="10" ry="7" fill="url(#ring)" transform="rotate(-20,-8,12)"/>
    <!-- 音符杆 -->
    <rect x="1" y="-24" width="3" height="38" rx="1.5" fill="url(#ring)"/>
    <!-- 音符旗 -->
    <path d="M4 -24 Q20 -18 16 -8 Q12 -16 4 -18 Z" fill="url(#ring)" opacity="0.8"/>
    <!-- 节拍线 -->
    <line x1="-25" y1="-8" x2="-12" y2="-8" stroke="#007DFF" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <line x1="10" y1="4" x2="25" y2="4" stroke="#007DFF" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <!-- 小节拍点 -->
    <circle cx="-25" cy="-8" r="2.5" fill="#FF6B35"/>
    <circle cx="25" cy="4" r="2.5" fill="#00C853"/>
  </g>
</svg>
