<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 780" width="360" height="780">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E8E8E8" stroke-width="0.5"/>
    </pattern>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000015"/>
    </filter>
  </defs>
  <!-- 纸张背景 -->
  <rect width="360" height="780" fill="#FAFAF8"/>
  <rect width="360" height="780" fill="url(#grid)"/>
  <!-- 中央分割线 -->
  <line x1="180" y1="40" x2="180" y2="740" stroke="#E0E0E0" stroke-width="1" stroke-dasharray="6,4"/>
  <!-- 左侧标签 -->
  <text x="90" y="30" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#BDBDBD">我的画板</text>
  <!-- 右侧标签 -->
  <text x="270" y="30" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#BDBDBD">对方画板</text>
  <!-- 边框 -->
  <rect x="8" y="8" width="344" height="764" rx="8" fill="none" stroke="#E0E0E0" stroke-width="1"/>
  <!-- 角落装饰 -->
  <g opacity="0.15">
    <path d="M20 760 L20 740 L40 760 Z" fill="#007DFF"/>
    <path d="M340 760 L340 740 L320 760 Z" fill="#007DFF"/>
  </g>
</svg>
